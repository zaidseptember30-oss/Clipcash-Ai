<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080b12">

<title>ClipCash AI — Creator Dashboard</title>

<style>

:root{
    --bg:#080b12;
    --panel:#10151f;
    --panel2:#0c1119;
    --line:#252e3b;
    --text:#f5f7fa;
    --muted:#8e99a8;
    --accent:#5ee7ff;
    --accent2:#8b5cf6;
    --success:#38d996;
    --danger:#ff5c70;
}

*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:
        radial-gradient(circle at top,#111b2c 0%,#080b12 45%);
    color:var(--text);
    font-family:Arial,Helvetica,sans-serif;
    min-height:100vh;
}

.container{
    width:min(1100px,92%);
    margin:0 auto;
    padding:40px 0;
}

header{
    text-align:center;
    margin-bottom:35px;
}

.logo{
    font-size:32px;
    font-weight:800;
    margin-bottom:8px;
}

.logo span{
    color:var(--accent);
}

.subtitle{
    color:var(--muted);
    font-size:15px;
}

.card{
    background:rgba(16,21,31,.95);
    border:1px solid var(--line);
    border-radius:18px;
    padding:28px;
    box-shadow:0 15px 40px rgba(0,0,0,.25);
}

.card h3{
    margin-top:0;
    font-size:22px;
}

.desc{
    color:var(--muted);
    line-height:1.6;
}

.upload{
    border:2px dashed var(--line);
    border-radius:14px;
    padding:30px 20px;
    text-align:center;
    margin:25px 0;
    background:var(--panel2);
    transition:.2s;
}

.upload:hover{
    border-color:var(--accent);
}

.upload input{
    width:100%;
    color:var(--text);
}

.small{
    color:var(--muted);
    margin:12px 0 0;
    word-break:break-word;
}

.grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:18px;
}

.half{
    display:flex;
    flex-direction:column;
    gap:8px;
}

label{
    font-size:14px;
    font-weight:600;
}

input,
select{
    width:100%;
    padding:14px;
    border-radius:10px;
    border:1px solid var(--line);
    background:#080b12;
    color:var(--text);
    outline:none;
}

input:focus,
select:focus{
    border-color:var(--accent);
}

.btn{
    width:100%;
    padding:15px;
    border:0;
    border-radius:11px;
    cursor:pointer;
    font-size:16px;
    font-weight:700;
    transition:.2s;
}

.btn.primary{
    background:linear-gradient(
        135deg,
        var(--accent),
        var(--accent2)
    );
    color:#fff;
}

.btn:hover{
    transform:translateY(-1px);
    opacity:.95;
}

.btn:disabled{
    opacity:.5;
    cursor:not-allowed;
    transform:none;
}

.output{
    margin-top:20px;
    padding:16px;
    border-radius:10px;
    background:var(--panel2);
    border:1px solid var(--line);
    color:var(--muted);
    line-height:1.5;
}

.output.success{
    color:var(--success);
    border-color:rgba(56,217,150,.35);
}

.output.error{
    color:var(--danger);
    border-color:rgba(255,92,112,.35);
}

.clipbox{
    margin-top:20px;
}

.clip{
    background:var(--panel2);
    border:1px solid var(--line);
    border-radius:12px;
    padding:16px;
    margin-bottom:12px;
}

.clip h4{
    margin:0 0 10px;
}

.clip p{
    color:var(--muted);
}

.clip a{
    display:inline-block;
    color:var(--accent);
    text-decoration:none;
    font-weight:600;
    margin-top:8px;
}

.clip a:hover{
    text-decoration:underline;
}

.clip video{
    width:100%;
    max-height:600px;
    border-radius:10px;
    margin-top:12px;
    background:#000;
}

.progress{
    width:100%;
    height:8px;
    background:#080b12;
    border-radius:10px;
    overflow:hidden;
    margin-top:12px;
}

.progress-bar{
    width:30%;
    height:100%;
    background:var(--accent);
    animation:loading 1.2s infinite ease-in-out;
}

@keyframes loading{

    0%{
        transform:translateX(-100%);
    }

    100%{
        transform:translateX(350%);
    }

}

@media(max-width:700px){

    .container{
        padding:25px 0;
    }

    .card{
        padding:20px;
    }

    .grid{
        grid-template-columns:1fr;
    }

    .logo{
        font-size:27px;
    }

}

</style>
</head>


<body>

<div class="container">

    <header>

        <div class="logo">
            ClipCash <span>AI</span>
        </div>

        <div class="subtitle">
            Turn long videos into viral-ready Shorts automatically.
        </div>

    </header>


    <div class="card">

        <h3>
            🚀 AI Video → Shorts
        </h3>

        <p class="desc">
            Upload a long video and ClipCash AI will transcribe it,
            find the strongest moments and render vertical Shorts.
        </p>


        <!-- VIDEO UPLOAD -->

        <div class="upload">

            <input
                type="file"
                accept="video/*"
                id="rawVideo"
            >

            <p
                id="rawName"
                class="small"
            >
                Choose your video
            </p>

        </div>


        <!-- SETTINGS -->

        <div class="grid">

            <div class="half">

                <label for="rawNiche">
                    Niche
                </label>

                <input
                    type="text"
                    id="rawNiche"
                    placeholder="podcast, cars, gaming..."
                >

            </div>


            <div class="half">

                <label for="rawCount">
                    Number of Shorts
                </label>

                <select id="rawCount">

                    <option value="3">
                        3
                    </option>

                    <option value="5" selected>
                        5
                    </option>

                    <option value="10">
                        10
                    </option>

                </select>

            </div>

        </div>


        <br>


        <!-- GENERATE BUTTON -->

        <button
            class="btn primary"
            id="generateBtn"
            onclick="processVideo()"
        >
            🚀 Generate Shorts
        </button>


        <!-- STATUS -->

        <div
            id="processStatus"
            class="output"
        >
            Upload a video to get started.
        </div>


        <!-- GENERATED CLIPS -->

        <div
            id="realClips"
            class="clipbox"
        ></div>

    </div>

</div>


<script>


/* ==========================================
   CLIPCASH AI BACKEND
========================================== */

const BACKEND_URL =
    "https://clipcash-ai-backend.onrender.com";


/* ==========================================
   SHOW SELECTED VIDEO
========================================== */

document
.getElementById("rawVideo")
.addEventListener("change", function(){

    const file = this.files[0];

    const name =
        document.getElementById("rawName");

    if(file){

        const sizeMB =
            (file.size / 1024 / 1024).toFixed(2);

        name.textContent =
            "Selected: " +
            file.name +
            " (" +
            sizeMB +
            " MB)";

    }else{

        name.textContent =
            "Choose your video";

    }

});


/* ==========================================
   PROCESS VIDEO
========================================== */

async function processVideo(){

    const videoInput =
        document.getElementById("rawVideo");

    const nicheInput =
        document.getElementById("rawNiche");

    const countInput =
        document.getElementById("rawCount");

    const status =
        document.getElementById("processStatus");

    const clips =
        document.getElementById("realClips");

    const button =
        document.getElementById("generateBtn");


    /* Check video */

    if(!videoInput.files.length){

        status.className =
            "output error";

        status.textContent =
            "❌ Please choose a video first.";

        return;

    }


    const video =
        videoInput.files[0];

    const niche =
        nicheInput.value.trim() || "general";

    const count =
        countInput.value;


    /* Create FormData */

    const formData =
        new FormData();


    /*
       IMPORTANT:
       These names must match
       the Flask backend.
    */

    formData.append(
        "video",
        video
    );

    formData.append(
        "niche",
        niche
    );

    formData.append(
        "count",
        count
    );


    /* Clear previous results */

    clips.innerHTML = "";


    /* Disable button */

    button.disabled = true;

    button.textContent =
        "⏳ Uploading...";


    status.className =
        "output";

    status.innerHTML = `
        Uploading your video...<br>

        <div class="progress">
            <div class="progress-bar"></div>
        </div>
    `;


    try{

        /*
           Send video to Flask
        */

        const response =
            await fetch(
                BACKEND_URL + "/api/process",
                {
                    method:"POST",
                    body:formData
                }
            );


        let data;

        try{

            data =
                await response.json();

        }catch(e){

            throw new Error(
                "Backend returned an invalid response."
            );

        }


        if(!response.ok){

            throw new Error(
                data.error ||
                data.message ||
                "Server error: " +
                response.status
            );

        }


        /*
           Backend should return
           a job ID.
        */

        const job =
            data.job ||
            data.id ||
            data.job_id;


        if(!job){

            throw new Error(
                "Backend did not return a job ID."
            );

        }


        status.className =
            "output";

        status.innerHTML = `
            ✅ Video uploaded successfully.<br>
            ClipCash AI is processing your video...

            <div class="progress">
                <div class="progress-bar"></div>
            </div>
        `;


        button.textContent =
            "⚙️ Processing...";


        /*
           Start checking job
        */

        checkJob(job);


    }catch(error){

        console.error(
            "ClipCash AI error:",
            error
        );

        status.className =
            "output error";

        status.textContent =
            "❌ " + error.message;

        button.disabled = false;

        button.textContent =
            "🚀 Generate Shorts";

    }

}


/* ==========================================
   CHECK BACKEND JOB
========================================== */

async function checkJob(job){

    const status =
        document.getElementById("processStatus");

    const button =
        document.getElementById("generateBtn");


    try{

        const response =
            await fetch(
                BACKEND_URL +
                "/api/jobs/" +
                encodeURIComponent(job)
            );


        let data;

        try{

            data =
                await response.json();

        }catch(e){

            throw new Error(
                "Backend returned an invalid job response."
            );

        }


        if(!response.ok){

            throw new Error(
                data.error ||
                data.message ||
                "Could not check job."
            );

        }


        console.log(
            "ClipCash AI job:",
            data
        );


        /* ==============================
           STILL PROCESSING
        ============================== */

        if(
    data.status === "queued" ||
    data.status === "processing" ||
    data.status === "working" ||
    data.status === "running" ||
    data.status === "pending"
){

        ){

            status.className =
                "output";

            status.innerHTML = `
                ⏳ ClipCash AI is creating your Shorts...

                <div class="progress">
                    <div class="progress-bar"></div>
                </div>
            `;


            setTimeout(
                function(){

                    checkJob(job);

                },
                3000
            );

            return;

        }


        /* ==============================
           FAILED
        ============================== */

        if(

            data.status === "error" ||

            data.status === "failed"

        ){

            throw new Error(
                data.error ||
                data.message ||
                "Video processing failed."
            );

        }


        /* ==============================
           COMPLETED
        ============================== */

        if(

            data.status === "done" ||

            data.status === "completed" ||

            data.output ||

            data.outputs ||

            data.clips

        ){

            showResults(data);

            button.disabled = false;

            button.textContent =
                "🚀 Generate Shorts";

            return;

        }


        /*
           Unknown status.
           Check again.
        */

        setTimeout(
            function(){

                checkJob(job);

            },
            3000
        );


    }catch(error){

        console.error(
            "Job error:",
            error
        );

        status.className =
            "output error";

        status.textContent =
            "❌ " + error.message;

        button.disabled = false;

        button.textContent =
            "🚀 Generate Shorts";

    }

}


/* ==========================================
   SHOW GENERATED SHORTS
========================================== */

function showResults(data){

    const status =
        document.getElementById("processStatus");

    const clips =
        document.getElementById("realClips");


    status.className =
        "output success";

    status.textContent =
        "✅ Your Shorts are ready!";


    /*
       Support multiple backend formats.
    */

    let results =
        data.clips ||
        data.outputs ||
        data.output ||
        data.files ||
        [];


    /*
       If backend returns a single
       object or filename.
    */

    if(!Array.isArray(results)){

        results = [results];

    }


    clips.innerHTML = "";


    /*
       No results
    */

    if(results.length === 0){

        clips.innerHTML = `
            <div class="clip">

                <h4>
                    ⚠️ No clips returned
                </h4>

                <p>
                    The video finished processing,
                    but the backend did not return
                    any Shorts.
                </p>

            </div>
        `;

        return;

    }


    /*
       Create each clip card
    */

    results.forEach(
        function(item,index){

            let url = "";
            let title =
                "Short #" + (index + 1);

            let description = "";


            /*
               String result
            */

            if(typeof item === "string"){

                url = item;

            }


            /*
               Object result
            */

            else if(item && typeof item === "object"){

                url =
                    item.url ||
                    item.output ||
                    item.file ||
                    item.filename ||
                    item.path ||
                    item.video ||
                    "";

                title =
                    item.title ||
                    item.name ||
                    "Short #" + (index + 1);

                description =
                    item.description ||
                    item.caption ||
                    "";

            }


            /*
               Convert backend relative
               paths into full URLs.
            */

            if(url){

                if(

                    url.startsWith("/")

                ){

                    url =
                        BACKEND_URL + url;

                }

                else if(

                    !url.startsWith("http://") &&

                    !url.startsWith("https://")

                ){

                    url =
                        BACKEND_URL +
                        "/outputs/" +
                        encodeURIComponent(url);

                }

            }


            /*
               Build card
            */

            const card =
                document.createElement("div");

            card.className =
                "clip";


            let html = `

                <h4>
                    🎬 ${escapeHTML(title)}
                </h4>

            `;


            if(description){

                html += `

                    <p>
                        ${escapeHTML(description)}
                    </p>

                `;

            }


            if(url){

                html += `

                    <video
                        controls
                        playsinline
                        preload="metadata"
                    >

                        <source
                            src="${escapeAttribute(url)}"
                            type="video/mp4"
                        >

                        Your browser does not support
                        video playback.

                    </video>

                    <a
                        href="${escapeAttribute(url)}"
                        target="_blank"
                        rel="noopener"
                        download
                    >
                        ⬇️ Download Short
                    </a>

                `;

            }else{

                html += `

                    <p>
                        ⚠️ No video URL was returned
                        for this clip.
                    </p>

                `;

            }


            card.innerHTML =
                html;


            clips.appendChild(card);

        }
    );

}


/* ==========================================
   SECURITY HELPERS
========================================== */

function escapeHTML(value){

    return String(value)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


function escapeAttribute(value){

    return String(value)
        .replace(/&/g,"&amp;")
        .replace(/"/g,"&quot;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;");

}

</script>

</body>
</html>
